<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Player</title>

<style>

html,body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
}

#music{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#485331;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    box-shadow:0 6px 15px rgba(0,0,0,.25);
    animation:spin 4s linear infinite;
    user-select:none;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body>

<div id="music">🎵</div>

<audio id="bgm" autoplay loop preload="auto">
    <source src="Timur.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung audio.
</audio>

<script>

const audio = document.getElementById("bgm");

// Volume 100%
audio.volume = 1.0;

// Fungsi memutar musik
function startMusic(){
    audio.play().catch(() => {});
}

// Coba autoplay
window.addEventListener("load", startMusic);

// Browser biasanya mengizinkan play setelah interaksi pertama
document.addEventListener("click", startMusic, {once:true});
document.addEventListener("touchstart", startMusic, {once:true});

// Kalau browser menghentikan audio, putar lagi
audio.addEventListener("pause", () => {
    startMusic();
});

// Kalau selesai (jaga-jaga), ulang dari awal
audio.addEventListener("ended", () => {
    audio.currentTime = 0;
    startMusic();
});

// Saat kembali ke tab ini
document.addEventListener("visibilitychange", () => {
    if(!document.hidden){
        startMusic();
    }
});

</script>

</body>
</html>
