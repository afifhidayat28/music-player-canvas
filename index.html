<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:transparent;
}

#musicBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    background:#485331;
    color:white;
    font-size:26px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    transition:.3s;
}

#musicBtn.playing{
    animation:spin 4s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
</style>

</head>

<body>

<button id="musicBtn">▶️</button>

<audio id="bgm" loop preload="auto">
    <source src="Timur.mp3" type="audio/mpeg">
</audio>

<script>

const bgm = document.getElementById("bgm");
const btn = document.getElementById("musicBtn");

bgm.volume = 1;

btn.addEventListener("click", async ()=>{

    if(bgm.paused){

        try{
            await bgm.play();
            btn.innerHTML="🎵";
            btn.classList.add("playing");
        }catch(e){
            alert("Browser tidak mengizinkan audio.");
        }

    }else{

        bgm.pause();
        btn.innerHTML="▶️";
        btn.classList.remove("playing");

    }

});

</script>

</body>
</html>
